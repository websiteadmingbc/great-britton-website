<title>Union City JADU | Great Britton Construction</title>
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2630;--brass:#b8894a;--paper:#f6f3ee;--card:#fffdf9;--line:#e3ddd2;--muted:#5f6b75}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
header{background:var(--ink);padding:10px 24px;display:flex;align-items:center;height:64px}
header img{height:48px;width:auto;display:block;filter:drop-shadow(0 1px 3px #0008)}
main{flex:1;display:grid;place-items:center;padding:32px 16px}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px;box-shadow:0 30px 60px -36px rgba(28,38,48,.45)}
.eyebrow{font:600 12px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
h1{font-family:Archivo,Inter,sans-serif;font-size:26px;line-height:1.15;margin:8px 0 6px}
p.sub{color:var(--muted);margin:0 0 22px;font-size:15px}
label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
input{width:100%;min-height:48px;border:1px solid #cfc7b9;border-radius:10px;padding:12px 14px;font:inherit;font-size:16px;background:#fff;color:var(--ink);margin-bottom:16px}
input:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px rgba(184,137,74,.25)}
button{width:100%;min-height:48px;border:0;border-radius:999px;background:var(--brass);color:#fff;font:600 15px Inter,sans-serif;cursor:pointer}
button:hover{background:#a6783c}button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button[disabled]{opacity:.7;cursor:wait}
.err{color:#9b3b2a;font-weight:600;font-size:14px;margin:-4px 0 14px;min-height:0}
.err:empty{display:none}
footer{color:var(--muted);font-size:13px;text-align:center;padding:20px}
</style>
</head>
<body>
<header><img src="/assets/great-britton-logo.png" alt="Great Britton Construction" width="960" height="320"></header>
<main>
  <form class="card" id="login" autocomplete="on">
    <div class="eyebrow">Private project preview</div>
    <h1>Sign in to view your concept</h1>
    <p class="sub">Enter the username and password Great Britton shared with you.</p>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <div class="err" id="err" role="alert" aria-live="assertive"></div>
    <button type="submit" id="go">View project</button>
  </form>
</main>

const f=document.getElementById('login'),err=document.getElementById('err'),go=document.getElementById('go');
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(user,pass){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(user.trim().toLowerCase()+':'+pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATA.iv)},key,b64(DATA.ct));
  return new TextDecoder().decode(buf);
}
f.addEventListener('submit',async e=>{
  e.preventDefault();err.textContent='';
  if(!window.crypto||!crypto.subtle){err.textContent='Please open this page in a current version of Chrome, Safari or Edge.';return;}
  go.disabled=true;go.textContent='Checking…';
  try{
    const html=await open(document.getElementById('u').value,document.getElementById('p').value);
    document.open();document.write(html);document.close();
  }catch(_){
    go.disabled=false;go.textContent='View project';
    err.textContent='That username or password isn’t right. Please try again.';
    document.getElementById('p').select();
  }
});
})();
